<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="730" fill="#f8fafc"/>
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">产品 / 版本 / 任务 / 子任务</text>
  <text x="600" y="70" text-anchor="middle" font-size="13" fill="#64748b">四级工作项与版本分支模型</text>

  <rect x="470" y="90" width="260" height="78" rx="10" fill="#1d4ed8" stroke="#1e3a8a"/>
  <text x="600" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">产品 Product</text>
  <text x="600" y="146" text-anchor="middle" font-size="12" fill="#dbeafe">目标 · 范围 · 仓库 · 成员 · 常驻上下文</text>

  <g font-size="14">
    <rect x="90" y="240" width="300" height="92" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="240" y="270" text-anchor="middle" font-weight="700" fill="#334155">版本 V0.9（已归档）</text>
    <text x="240" y="294" text-anchor="middle" font-size="12" fill="#475569">交付范围已冻结 · 只读</text>
    <text x="240" y="316" text-anchor="middle" font-size="12" fill="#475569">分支 release/v0.9</text>

    <rect x="450" y="240" width="300" height="92" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="600" y="270" text-anchor="middle" font-weight="700" fill="#1e3a8a">版本 V1.0（开发中）</text>
    <text x="600" y="294" text-anchor="middle" font-size="12" fill="#1e40af">版本负责人 · 交付范围 · 计划日期</text>
    <text x="600" y="316" text-anchor="middle" font-size="12" fill="#1e40af">分支 release/v1.0</text>

    <rect x="810" y="240" width="300" height="92" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="960" y="270" text-anchor="middle" font-weight="700" fill="#334155">版本 V1.1（规划中）</text>
    <text x="960" y="294" text-anchor="middle" font-size="12" fill="#475569">范围待定 · 任务未启动</text>
    <text x="960" y="316" text-anchor="middle" font-size="12" fill="#475569">分支 release/v1.1（待建）</text>
  </g>

  <g stroke="#64748b" stroke-width="1.6" fill="none">
    <path d="M600,168 L600,196" />
    <path d="M240,196 L960,196"/>
    <path d="M240,196 L240,236" marker-end="url(#a4)"/>
    <path d="M600,196 L600,236" marker-end="url(#a4)"/>
    <path d="M960,196 L960,236" marker-end="url(#a4)"/>
  </g>

  <g font-size="13">
    <rect x="450" y="400" width="180" height="80" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="540" y="428" text-anchor="middle" font-weight="700" fill="#1e3a8a">任务 T-001</text>
    <text x="540" y="450" text-anchor="middle" font-size="12" fill="#1e40af">前端页面 · L2 · M2</text>
    <text x="540" y="468" text-anchor="middle" font-size="12" fill="#1e40af">状态：执行中</text>

    <rect x="650" y="400" width="180" height="80" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="740" y="428" text-anchor="middle" font-weight="700" fill="#1e3a8a">任务 T-002</text>
    <text x="740" y="450" text-anchor="middle" font-size="12" fill="#1e40af">后端接口 · L3 · M3</text>
    <text x="740" y="468" text-anchor="middle" font-size="12" fill="#1e40af">状态：排队中</text>

    <rect x="850" y="400" width="180" height="80" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="940" y="428" text-anchor="middle" font-weight="700" fill="#1e3a8a">任务 T-003</text>
    <text x="940" y="450" text-anchor="middle" font-size="12" fill="#1e40af">测试执行 · L1 · M1</text>
    <text x="940" y="468" text-anchor="middle" font-size="12" fill="#1e40af">状态：待验收</text>
  </g>

  <g stroke="#64748b" stroke-width="1.6" fill="none">
    <path d="M600,332 L600,360 L540,360 L540,396" marker-end="url(#a4)"/>
    <path d="M600,360 L740,360 L740,396" marker-end="url(#a4)"/>
    <path d="M600,360 L940,360 L940,396" marker-end="url(#a4)"/>
  </g>

  <g font-size="12">
    <rect x="450" y="520" width="170" height="62" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="535" y="545" text-anchor="middle" font-weight="700" fill="#166534">子任务 T-001-1</text>
    <text x="535" y="566" text-anchor="middle" fill="#166534">Runner A · Codex CLI</text>

    <rect x="650" y="520" width="170" height="62" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="735" y="545" text-anchor="middle" font-weight="700" fill="#166534">子任务 T-001-2</text>
    <text x="735" y="566" text-anchor="middle" fill="#166534">Runner B · Claude Code</text>
  </g>

  <g stroke="#64748b" stroke-width="1.4" fill="none">
    <path d="M540,480 L540,500 L535,500 L535,516" marker-end="url(#a4)"/>
    <path d="M540,500 L735,500 L735,516" marker-end="url(#a4)"/>
  </g>

  <rect x="90" y="400" width="330" height="182" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="110" y="430" font-size="15" font-weight="700" fill="#312e81">归集口径</text>
  <text x="110" y="456" font-size="12" fill="#3730a3">· 任务必须归属唯一版本</text>
  <text x="110" y="478" font-size="12" fill="#3730a3">· 成本：任务 → 版本 → 产品逐级汇总</text>
  <text x="110" y="500" font-size="12" fill="#3730a3">· 进度：版本完成数 / 版本总任务数</text>
  <text x="110" y="522" font-size="12" fill="#3730a3">· 子任务完成 ≠ 任务验收通过</text>
  <text x="110" y="544" font-size="12" fill="#3730a3">· 版本状态由版本负责人手动维护</text>
  <text x="110" y="566" font-size="12" fill="#3730a3">· 版本归档后只读，不可新建任务</text>

  <rect x="90" y="596" width="1020" height="50" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="110" y="617" font-size="13" font-weight="700" fill="#166534">任务状态派生规则</text>
  <text x="110" y="636" font-size="12" fill="#166534">子任务全部完成只代表任务可提交评审，任务是否完成仍由 G3 验收决定；任一子任务失败或待人工时，任务保持执行中并提醒负责人。</text>

  <rect x="90" y="662" width="1020" height="46" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="600" y="691" text-anchor="middle" font-size="13" fill="#92400e">一版一分支：任务分支 ai/{任务编号}-{描述} 从 release/v{版本} 拉出；PR 目标为版本分支；版本结束后由人合并回主干。</text>
</svg>
